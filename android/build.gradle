allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Project.buildDir is deprecated in Gradle 9; use layout.buildDirectory.
def newBuildDir = rootProject.layout.buildDirectory.dir("../../build").get()
rootProject.layout.buildDirectory.value(newBuildDir)

subprojects {
    project.layout.buildDirectory.value(newBuildDir.dir(project.name))
}

// AGP 9 fails the build when a library module compiles against an older SDK
// than its AndroidX dependencies need ("checking AAR metadata" errors).
// Some unmaintained pub.dev plugins still use compileSdk 33, so raise every
// plugin module to the app's compileSdk. Must stay above evaluationDependsOn.
subprojects { p ->
    p.afterEvaluate {
        if (p.plugins.hasPlugin("com.android.library")) {
            p.android.compileSdk = 36
        }
    }
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
