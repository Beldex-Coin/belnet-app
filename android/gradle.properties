org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Jetifier is deprecated in AGP 9 and slows builds. Try setting this to false;
# if no dependency still uses the old android.support libraries, delete the line.
android.enableJetifier=true
#android.enableR8=true

# --- AGP 9 migration flags (same as the Flutter 3.50 app template) ---
# Keep the legacy AGP DSL: the Flutter Gradle plugin still needs it.
android.newDsl=false
# The app and belnet_lib are already migrated to built-in Kotlin.
# Leave this false until every pub.dev plugin is migrated (Flutter prints the
# list of plugins that still apply kotlin-android), then switch it to true.
android.builtInKotlin=false
