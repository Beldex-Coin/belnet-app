pluginManagement {
    def localPropertiesFile = new File(rootProject.projectDir, "local.properties")
    def properties = new Properties()

    assert localPropertiesFile.exists(), "local.properties file not found"
    localPropertiesFile.withReader("UTF-8") { reader -> properties.load(reader) }

    def flutterSdkPath = properties.getProperty("flutter.sdk")
    assert flutterSdkPath != null, "flutter.sdk not set in local.properties"

    settings.ext.flutterSdkPath = flutterSdkPath
    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.2"
    id "com.android.application" version "9.3.1" apply false
    // Keep this line: with "apply false" it only puts KGP on the classpath, which
    // built-in Kotlin uses. Removing it drops Kotlin to AGP's bundled 2.2.10,
    // which Flutter rejects.
    id "org.jetbrains.kotlin.android" version "2.4.20" apply false
}

include ":app"