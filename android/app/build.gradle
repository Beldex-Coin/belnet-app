plugins {
    id "com.android.application"
    // "kotlin-android" removed: AGP 9 compiles Kotlin itself (built-in Kotlin).
    // The Flutter Gradle Plugin must be applied after the Android plugin.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "io.beldex.belnet"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion   // 28.2.13676358 on Flutter 3.50

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    // lintOptions {} was removed in AGP 9; lint {} replaces it.
    lint {
        disable.addAll(["Instantiatable", "InvalidPackage"])
    }

    defaultConfig {
        applicationId = "io.beldex.belnet"
        minSdk = 24
        targetSdk = 36
        // Read from pubspec.yaml (version: x.y.z+code) by the Flutter plugin.
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            signingConfig = signingConfigs.debug
        }
    }
}

// Replaces android { kotlinOptions { jvmTarget = "17" } }, which fails with KGP 2.2+.
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

flutter {
    source = "../.."
}

dependencies {
    // enableEdgeToEdge() for MainActivity (needs compileSdk 35+).
    implementation "androidx.activity:activity-ktx:1.10.1"
}
