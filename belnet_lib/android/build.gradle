plugins {
    id "com.android.library"
    // "kotlin-android" removed: AGP 9 compiles Kotlin itself (built-in Kotlin).
    // While android.builtInKotlin=false, the Flutter Gradle Plugin applies it for us.
}

group = "io.beldex.belnet_lib"
version = "1.0-SNAPSHOT"

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

android {
    namespace = "io.beldex.belnet_lib"
    // AGP 9 requires library consumers to use the same or higher compileSdk,
    // so keep this in step with the app (36).
    compileSdk = 36
    ndkVersion = "28.2.13676358"

    sourceSets {
        main.java.srcDirs += "src/main/java"
        main.java.srcDirs += "src/main/kotlin"
        main.jniLibs.srcDirs += "src/main/jniLibs"
    }

    defaultConfig {
        minSdk = 23
    }

    // lintOptions {} was removed in AGP 9; lint {} replaces it.
    lint {
        disable.add("InvalidPackage")
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

// Replaces android { kotlinOptions { jvmTarget = "17" } }, which fails with KGP 2.2+.
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    // Explicit dep for ContextCompat / NotificationCompat used by the plugin
    // and BelnetDaemon (previously resolved only transitively).
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.lifecycle:lifecycle-livedata:2.8.7"

    // JVM unit tests for the Ad Blocker engine (network.beldex.belnet.adblock):
    //   cd android && ./gradlew :belnet_lib:testDebugUnitTest
    testImplementation "junit:junit:4.13.2"
}

// Native-lib tasks. Gradle 9: register tasks lazily instead of `task x(type: ...)`.
def cleanNativeLibs = tasks.register("cleanNativeLibs", Delete) {
    delete "$projectDir/../external/belnet/build-android"
}

// Builds the native .so from external/belnet when that checkout exists.
// When it doesn't (normal case: prebuilt .so files in src/main/jniLibs), the
// task is skipped. It used to run the dummy command `true`, which Gradle 9
// fails to start ("A problem occurred starting process 'command 'true''").
def nativeBuildScript = file("$projectDir/../external/belnet/contrib/android.sh")
def compileNativeLibs = tasks.register("compileNativeLibs", Exec) {
    onlyIf { nativeBuildScript.exists() }
    if (nativeBuildScript.exists()) {
        workingDir "$projectDir/../external/belnet"
        environment "NDK", project.android.ndkDirectory
        executable nativeBuildScript.absolutePath
    }
}

def ensureNativeLibs = tasks.register("ensureNativeLibs", Copy) {
    dependsOn compileNativeLibs
    from("$projectDir/../external/belnet/build-android") {
        include 'out/*/*.so'
        eachFile { fcd ->
            fcd.relativePath = new RelativePath(true, fcd.relativePath.segments.drop(1))
        }
    }
    into "$projectDir/src/main/jniLibs/"
}

tasks.named("preBuild") { dependsOn ensureNativeLibs }
tasks.named("clean") { dependsOn cleanNativeLibs }
